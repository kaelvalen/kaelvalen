name: Portfolio
on:
  push:
    branches: ["main"]
    paths: ["portfolio/**", ".github/workflows/portfolio.yml"]
  pull_request:
    paths: ["portfolio/**", ".github/workflows/portfolio.yml"]

defaults:
  run:
    working-directory: portfolio

jobs:
  verify:
    name: Lint, types, unit tests, build, budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The revision block is compiled from this directory's git history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: portfolio/out
          retention-days: 3

  e2e:
    name: Behaviour, accessibility, pixels
    needs: verify
    runs-on: ubuntu-latest
    # The same image the screenshot baselines were made in, so fonts and rasterisation match.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: portfolio/out
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: portfolio/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: portfolio/out
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx -y @lhci/cli@0.15.1 autorun
